services:
  - type: web
    name: verida-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@verida/shared && npx drizzle-kit push --config=drizzle.config.ts && npm run build --workspace=@verida/api
    startCommand: cd apps/api && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHELBY_NETWORK
        value: shelbynet
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SHELBY_API_KEY
        sync: false
      - key: SHELBY_SIGNER_PRIVATE_KEY
        sync: false
      - key: SHELBY_RPC_URL
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: APTOS_NODE_URL
        sync: false
    healthCheckPath: /healthz
    autoDeploy: true
